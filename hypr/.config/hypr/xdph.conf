# xdg-desktop-portal-hyprland.
screencopy {
    # Chromium-based browsers open two capture sessions per share; the restore token lets the
    # second one reuse the first choice instead of showing the picker again.
    allow_token_by_default = true
    # Embed the cursor when the client does not request a cursor mode (Chromium/Electron/Discord).
    cursor_mode = 2
}
