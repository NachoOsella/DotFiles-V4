# Gruvbox Material Dark Hard lock screen: green accents, square corners.
# Corner widgets anchor to screen edges so the layout holds on every monitor.

$font = JetBrainsMono Nerd Font
$scripts = ~/.config/hypr/scripts

# Gruvbox Material Dark Hard palette.
$bg0 = rgba(29, 32, 33, 0.92)
$fg0 = rgba(212, 190, 152, 1.0)
$fg1 = rgba(221, 199, 161, 1.0)
$gray = rgba(124, 111, 100, 1.0)
$red = rgba(234, 105, 98, 1.0)
$green = rgba(169, 182, 101, 1.0)
$greenDim = rgba(169, 182, 101, 0.35)
$yellow = rgba(216, 166, 87, 1.0)

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = easeOut, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 3, easeOut
    animation = inputFieldDots, 1, 2, easeOut
    animation = inputFieldColors, 1, 3, easeOut
}

background {
    monitor =
    path = ~/dotfiles/assets/wallpapers/wallpaper.png
    color = rgba(29, 32, 33, 1.0)
    blur_passes = 4
    blur_size = 6
    noise = 0.012
    contrast = 0.92
    brightness = 0.55
    vibrancy = 0.12
    vibrancy_darkness = 0.1
}

# ---------------------------------------------------------------- top bar

label {
    monitor =
    text = <b>󰌾  SESSION LOCKED</b>
    color = $green
    font_size = 10
    font_family = $font
    position = 40, -32
    halign = left
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] echo "󰔟  up $(uptime -p | sed 's/^up //')"
    color = $gray
    font_size = 10
    font_family = $font
    position = -40, -32
    halign = right
    valign = top
}

# ---------------------------------------------------------------- clock

label {
    monitor =
    text = cmd[update:1000] date +'<b>%H<span foreground="##a9b665">:</span><span foreground="##a9b665">%M</span></b>'
    color = $fg1
    font_size = 120
    font_family = $font
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +'%S'
    color = $greenDim
    font_size = 14
    font_family = $font
    position = 0, 85
    halign = center
    valign = center
}

shape {
    monitor =
    size = 360, 1
    color = $greenDim
    rounding = 0
    position = 0, 62
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +'%A  ·  %d %B %Y' | tr '[:lower:]' '[:upper:]'
    color = $fg0
    font_size = 12
    font_family = $font
    position = 0, 38
    halign = center
    valign = center
}

# ---------------------------------------------------------------- password

input-field {
    monitor =
    size = 420, 52
    outline_thickness = 2
    rounding = 0
    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = true
    dots_rounding = 0
    outer_color = $green
    inner_color = $bg0
    font_color = $green
    check_color = $yellow
    fail_color = $red
    capslock_color = $yellow
    fade_on_empty = false
    hide_input = false
    font_family = $font
    placeholder_text = <span foreground="##7c6f64">󰌾  password for $USER</span>
    fail_text = <span foreground="##ea6962"><b>󰅙  $FAIL  ($ATTEMPTS)</b></span>
    check_text = <span foreground="##d8a657">󰄬  authenticating</span>
    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰌌  $LAYOUT
    color = $gray
    font_size = 9
    font_family = $font
    position = 0, -100
    halign = center
    valign = center
}

# ---------------------------------------------------------------- music (bottom left)

image {
    monitor =
    path = ~/.config/hypr/assets/empty.png
    size = 56
    rounding = 0
    border_size = 0
    reload_time = 2
    reload_cmd = $scripts/albumart.sh
    position = 40, 40
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] $scripts/songdetail.sh title
    color = $fg1
    font_size = 11
    font_family = $font
    position = 112, 70
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] $scripts/songdetail.sh artist
    color = $gray
    font_size = 9
    font_family = $font
    position = 112, 46
    halign = left
    valign = bottom
}

# ---------------------------------------------------------------- system (bottom right)

label {
    monitor =
    text = cmd[update:30000] echo "<span foreground='##a9b665'>󰁹</span>  $(cat /sys/class/power_supply/BAT1/capacity)%   <span foreground='##3c3836'>│</span>   <span foreground='##a9b665'></span>  $USER@$(cat /etc/hostname)"
    color = $fg0
    font_size = 10
    font_family = $font
    position = -40, 40
    halign = right
    valign = bottom
}
