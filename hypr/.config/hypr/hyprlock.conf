# Minimal centered lock screen using Gruvbox Material Dark Hard.

$font = JetBrainsMono Nerd Font

# Gruvbox Material Dark Hard palette.
$bg0 = rgba(29, 32, 33, 0.88)
$bg2 = rgba(60, 56, 54, 0.72)
$fg0 = rgba(212, 190, 152, 1.0)
$fg1 = rgba(221, 199, 161, 1.0)
$gray = rgba(146, 131, 116, 1.0)
$red = rgba(234, 105, 98, 1.0)
$green = rgba(169, 182, 101, 1.0)
$yellow = rgba(216, 166, 87, 1.0)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = easeOut, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 3, easeOut
    animation = fadeOut, 1, 2, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = ~/dotfiles/assets/wallpapers/wallpaper.png
    blur_passes = 3
    blur_size = 5
    contrast = 0.96
    brightness = 0.72
    vibrancy = 0.10
    vibrancy_darkness = 0.08
    zindex = -10
}

# Split-color clock matching the reference composition.
label {
    monitor =
    text = cmd[update:1000] date +"%H"
    color = $fg1
    font_size = 108
    font_family = $font
    position = -114, 270
    halign = center
    valign = center
    zindex = 10
}

label {
    monitor =
    text = :
    color = $fg0
    font_size = 94
    font_family = $font
    position = 0, 273
    halign = center
    valign = center
    zindex = 10
}

label {
    monitor =
    text = cmd[update:1000] date +"%M"
    color = $green
    font_size = 108
    font_family = $font
    position = 114, 270
    halign = center
    valign = center
    zindex = 10
}

label {
    monitor =
    text = cmd[update:60000] date +"%A,  %d %B %Y"
    color = $fg0
    font_size = 14
    font_family = $font
    position = 0, 170
    halign = center
    valign = center
    zindex = 10
}

# The square corners are the only departure from the softer reference.
input-field {
    monitor =
    size = 560, 58
    outline_thickness = 1
    rounding = 0
    dots_size = 0.15
    dots_spacing = 0.34
    dots_center = false
    outer_color = $green
    inner_color = $bg0
    font_color = $fg1
    check_color = $yellow
    fail_color = $red
    fade_on_empty = false
    hide_input = false
    font_family = $font
    placeholder_text = <span foreground="##928374">󰌾  ENTER PASSWORD</span>
    fail_text = <span foreground="##ea6962">󰅙  ACCESS DENIED  //  TRY AGAIN</span>
    check_text = <span foreground="##d8a657">󰄬  AUTHENTICATING</span>
    position = 0, 76
    halign = center
    valign = center
    zindex = 10
}

# Spotify metadata card with a fixed information grid and no controls.
shape {
    monitor =
    size = 560, 170
    color = $bg2
    rounding = 0
    position = 0, -80
    halign = center
    valign = center
    zindex = 0
}

shape {
    monitor =
    size = 558, 168
    color = $bg0
    rounding = 0
    position = 0, -80
    halign = center
    valign = center
    zindex = 1
}

# Album-art placeholder built from the existing Spotify asset.
shape {
    monitor =
    size = 100, 126
    color = $bg2
    rounding = 0
    position = -214, -80
    halign = center
    valign = center
    zindex = 2
}

image {
    monitor =
    path = ~/.config/hypr/assets/spotify.png
    size = 100
    rounding = 0
    border_size = 0
    reload_time = 2
    reload_cmd = /home/nacho/.config/hypr/scripts/albumart.sh
    position = -214, -80
    halign = center
    valign = center
    zindex = 10
}

shape {
    monitor =
    size = 1, 126
    color = $bg2
    rounding = 0
    position = -146, -80
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text =   SPOTIFY
    color = $green
    font_size = 9
    font_family = $font
    position = 830, -20
    halign = left
    valign = center
    zindex = 10
}

label {
    monitor =
    text = cmd[update:3000] ~/.config/hypr/scripts/songdetail.sh status
    color = $gray
    font_size = 9
    font_family = $font
    position = -705, -20
    halign = right
    valign = center
    zindex = 10
}

label {
    monitor =
    text = cmd[update:3000] ~/.config/hypr/scripts/songdetail.sh title
    color = $fg1
    font_size = 17
    font_family = $font
    position = 830, -53
    halign = left
    valign = center
    zindex = 10
}

label {
    monitor =
    text = cmd[update:3000] ~/.config/hypr/scripts/songdetail.sh artist
    color = $green
    font_size = 11
    font_family = $font
    position = 830, -81
    halign = left
    valign = center
    zindex = 10
}

label {
    monitor =
    text = cmd[update:3000] ~/.config/hypr/scripts/songdetail.sh album
    color = $gray
    font_size = 10
    font_family = $font
    position = 830, -105
    halign = left
    valign = center
    zindex = 10
}

label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/songdetail.sh progress
    color = $gray
    font_size = 9
    font_family = $font
    position = 830, -139
    halign = left
    valign = center
    zindex = 10
}

# Open footer, without an additional container.
image {
    monitor =
    path = ~/.config/hypr/assets/archlinux.png
    size = 24
    rounding = 0
    border_size = 0
    position = -104, -440
    halign = center
    valign = center
    zindex = 10
}

label {
    monitor =
    text = ARCH LINUX   |   <span foreground="##a9b665">HYPRLAND</span>
    color = $gray
    font_size = 10
    font_family = $font
    position = 30, -440
    halign = center
    valign = center
    zindex = 10
}
