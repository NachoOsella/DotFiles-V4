# Theme for hyprtoolkit apps, including the screen share picker (xdg-desktop-portal-hyprland >= 1.5).
# Gruvbox Material Dark Hard, same values as quickshell/config/Theme.qml.

background = rgb(1d2021)
base = rgb(282828)
alternate_base = rgb(32302f)

text = rgb(d4be98)
bright_text = rgb(ddc7a1)

accent = rgb(a9b665)
accent_secondary = rgb(89b482)

font_family = JetBrainsMono Nerd Font
font_size = 11
small_font_size = 9
h1_size = 16
h2_size = 14
h3_size = 12

rounding_large = 0
rounding_small = 0

icon_theme = gruvbox-dark-icons-gtk
